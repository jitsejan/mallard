name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes about a minute; a hung download should not burn the free minutes.
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets Codecov verify the upload comes from this repository, so no Codecov token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run invoke lint
      - run: uv run invoke audit
      # No lake credentials here, so tests marked `lake` skip.
      - run: uv run invoke test
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true
      # Catches anything committed from a machine without the hooks installed.
      - run: uv run pre-commit run --all-files
