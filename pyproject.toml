[project]
name = "mallard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jitse-Jan", email = "code@jitsejan.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dlt[ducklake]>=1.31.0",
    "duckdb>=1.5.6",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "s3fs>=2026.9.0",
]

[project.scripts]
mallard = "mallard:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
