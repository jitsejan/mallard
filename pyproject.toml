[project]
name = "mallard"
version = "0.1.0"
description = "Personal data platform on free tiers: dlt, DuckLake, dbt and Dagster, published as a private dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jitse-Jan", email = "code@jitsejan.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dlt[ducklake]>=1.31.0",
    "duckdb>=1.5.6",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "s3fs>=2026.9.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests", "tasks.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=mallard", "--cov-report=term-missing", "--cov-report=xml"]
markers = ["lake: needs the real lake; skipped when its credentials are missing"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Measured offline, as CI runs. Only ever raise this.
fail_under = 95
